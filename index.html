/* ---- armazenamento Supabase: todos os registros exigem sessão autenticada ---- */
function put(n,obj){
  var prev=data[n].findIndex(function(x){return x.id===obj.id}),before=prev<0?null:data[n][prev];
  if(prev<0)data[n].push(obj);else data[n][prev]=obj;
  render();
  return sbClient.from("app_records").upsert({collection:n,id:String(obj.id),data:obj,updated_at:new Date().toISOString()},{onConflict:"collection,id"})
    .then(function(r){if(r.error)throw r.error;mode="db";status()})
    .catch(function(e){if(prev<0)data[n]=data[n].filter(function(x){return x.id!==obj.id});else data[n][prev]=before;render();toast("Não foi possível salvar no banco: "+(e&&e.message||e),1);return false});
}
async function del(n,id){
  if(!await confirmar("Excluir este registro?"))return;
  var before=data[n].slice();data[n]=data[n].filter(function(x){return x.id!==id});render();
  var r=await sbClient.from("app_records").delete().eq("collection",n).eq("id",String(id));
  if(r.error){data[n]=before;render();toast("Não foi possível excluir: "+(r.error.message||r.error),1)}
}
function status(){$("#st").textContent=mode==="db"?"● Dados salvos no Supabase":"● Conectando ao Supabase…"}

/* ---- caixa e plano de contas ---- */
function fdata(d){var p=String(d||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d}
function contaNome(id){var c=data.contas.find(function(x){return x.id===id});return c?((c.codigo?c.codigo+" – ":"")+c.nome):"—"}
function optsOf(f){
  if(f.opts==="contas")return [["","— Sem conta —"]].concat(data.contas.slice().sort(function(a,b){return String(a.codigo).localeCompare(String(b.codigo),"pt-BR",{numeric:true})}).map(function(c){return[c.id,(c.codigo?c.codigo+" – ":"")+c.nome]}));
  return f.opts;
}
function selectHtml(f,cur){return '<select name="'+f.k+'">'+optsOf(f).map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return'<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(l)+'</option>'}).join("")+'</select>'}
function totais(){var e=0,s=0;data.lancamentos.forEach(function(x){var v=Number(x.valor)||0;if(x.tipo==="Débito")s+=v;else e+=v});return{e:e,s:s,saldo:e-s}}
function saldo(){return totais().saldo}
function caixaKpis(){var t=totais();return'<div class="kpis">'+kpi("Créditos (entradas)",brl(t.e))+kpi("Débitos (saídas)",brl(t.s))+kpi("Saldo do caixa",'<span class="'+(t.saldo<0?"low":"")+'">'+brl(t.saldo)+'</span>')+'</div>'}
function seed(){[["1.01","Serviços","Receita"],["1.02","Outras receitas","Receita"],["2.01","Fornecedores","Despesa"],["2.02","Aluguel","Despesa"],["2.03","Salários","Despesa"],["2.04","Impostos","Despesa"],["2.05","Despesas gerais","Despesa"]].forEach(function(a){put("contas",{id:newId(),codigo:a[0],nome:a[1],tipo:a[2]})})}

/* ---- PDV e contas a receber ---- */
var FORMAS=["Dinheiro","Pix","Cartão de débito","Cartão de crédito","Boleto","Transferência"];
var cart=[],pv={cli:"",forma:"vista",n:3,venc:addDias(hoje(),30),int:30,pgto:"Dinheiro"},rf="abertas";
function hoje(){return new Date().toISOString().slice(0,10)}
function addDias(d,n){var x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function r2(n){return Math.round(n*100)/100}
function so(a,cur){return a.map(function(x){var v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return'<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(l)+'</option>'}).join("")}
function servNome(p){if(p.servicos)return p.servicos;var v=data.vendas.find(function(x){return x.id===p.vendaId});return v&&v.itens?v.itens.map(function(i){return i.nome}).join(", "):"—"}
function saldoP(p){return r2((Number(p.valor)||0)-(Number(p.pago)||0))}
function stP(p){if(saldoP(p)<=0)return"Paga";if(p.vencimento<hoje())return"Vencida";return Number(p.pago)>0?"Parcial":"Aberta"}
function totalAberto(){return r2(data.receber.reduce(function(s,p){return s+Math.max(saldoP(p),0)},0))}
function parcelas(t,n,v,i){var b=Math.floor(t/n*100)/100,a=[];for(var k=0;k<n;k++)a.push({num:k+1,valor:k===n-1?r2(t-b*(n-1)):b,vencimento:addDias(v,i*k)});return a}

  var o=Object.assign({},p);o.baixas=(p.baixas||[]).concat([{data:dt,valor:valor,forma:forma}]);o.pago=r2((Number(p.pago)||0)+valor);

}
function finalizar(){
  if(!cart.length)return alert("Adicione ao menos um serviço.");
  var vista=pv.forma==="vista",cli=data.clientes.find(function(c){return c.id===pv.cli});

  var tot=r2(cart.reduce(function(s,i){return s+i.qtd*i.preco},0)),vid=newId(),nome=cli?cli.nome:"Consumidor";
  var num=data.vendas.reduce(function(m,v){return Math.max(m,v.numero||0)},0)+1;

  put("vendas",{id:vid,numero:num,data:hoje(),cliente:pv.cli,clienteNome:nome,itens:cart,total:tot,forma:vista?"À vista":"A prazo"});
  ps.forEach(function(p){
    var o={id:newId(),vendaId:vid,venda:num,servicos:cart.map(function(i){return i.nome}).join(", "),cliente:pv.cli,clienteNome:nome,num:p.num,total:ps.length,valor:p.valor,vencimento:p.vencimento,pago:0,baixas:[]};
    if(vista)baixar(o,p.valor,hoje(),pv.pgto);else put("receber",o);
  });
  
  cart=[];alert("Serviço nº "+num+" finalizado"+(vista?"":" — "+ps.length+" parcela(s) lançada(s) em Contas a receber")+".");render();

function extenso(v){
  var U=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"],
  D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],
  C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  function t(n){if(n===100)return"cem";var c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r){if(r<20)p.push(U[r]);else{var d=Math.floor(r/10),u=r%10;p.push(D[d]+(u?" e "+U[u]:""))}}return p.join(" e ")}
  function inteiro(n){
    if(n===0)return"zero";
    var mi=Math.floor(n/1e6),mil=Math.floor(n%1e6/1e3),r=n%1e3,p=[];
    if(mi)p.push(t(mi)+(mi===1?" milhão":" milhões"));
    if(mil)p.push(mil===1?"mil":t(mil)+" mil");
    if(r)p.push(t(r));
    var out="",last=r||mil;
    p.forEach(function(x,i){if(i===0)out=x;else out+=(i===p.length-1&&(last<100||last%100===0)?" e ":", ")+x});
    return out;
  }
  var tot=Math.round((Number(v)||0)*100),rs=Math.floor(tot/100),ct=tot%100,a=[];
  if(rs>0)a.push(inteiro(rs)+(rs===1?" real":" reais"));
  if(ct>0)a.push(inteiro(ct)+(ct===1?" centavo":" centavos"));
  return a.length?a.join(" e "):"zero real";
}

  }
  var S=SCHEMA[view],list=data[view].filter(function(x){return !q||JSON.stringify(x).toLowerCase().indexOf(q.toLowerCase())>-1});
  list.sort(function(a,b){return view==="lancamentos"?String(b.data).localeCompare(String(a.data)):String(a.nome||a.codigo).localeCompare(String(b.nome||b.codigo),"pt-BR")});
  app.innerHTML='<h1>'+S.plural+'</h1><p class="sub">'+data[view].length+' registro(s)</p>'+(view==="lancamentos"?caixaKpis():"")+
    '<div class="panel"><div class="bar"><input id="busca" placeholder="Buscar…" value="'+esc(q)+'"><button class="btn" id="novo">'+(view==="lancamentos"?"+ Crédito (entrada)":"+ "+(S.g?"Nova ":"Novo ")+S.titulo.toLowerCase())+'</button>'+(view==="lancamentos"?'<button class="btn g" id="novoC">+ Débito (saída)</button><input type="date" id="rdia" value="'+rdia+'" style="width:auto;flex:none"><button class="btn g" id="pdfC">Relatório diário (PDF)</button>':"")+(view==="produtos"?'<button class="btn g" id="rsv">Resumo por cliente (PDF)</button>':"")+(view==="contas"&&!data.contas.length?'<button class="btn g" id="seed">Carregar plano básico</button>':"")+'</div>'+tabela(view,list)+'</div>';
  $("#busca").oninput=function(e){q=e.target.value;var pos=e.target.selectionStart;render();var b=$("#busca");b.focus();b.setSelectionRange(pos,pos)};
  $("#novo").onclick=function(){abrir(null,view==="lancamentos"?{tipo:"Crédito"}:null)};
  var nc=$("#novoC");if(nc)nc.onclick=function(){abrir(null,{tipo:"Débito"})};
  var sd=$("#seed");if(sd)sd.onclick=seed;
  var rv=$("#rsv");if(rv)rv.onclick=abrirResumos;
  var rm=$("#rsm");if(rm)rm.onclick=resumoMarcados;
  var pc=$("#pdfC");if(pc){$("#rdia").onchange=function(e){rdia=e.target.value||hoje()};pc.onclick=function(){pdfCaixa(rdia)}}
}
function kpi(l,v){return '<div class="kpi"><small>'+l+'</small><b>'+v+'</b></div>'}
function tabela(n,list,ro){
  if(!list.length)return '<div class="empty">Nada cadastrado ainda.</div>';
  var cols=SCHEMA[n].campos.filter(function(f){return f.k!=="uf"});
  var h='<div class="tw"><table><thead><tr>'+(n==="produtos"?'<th style="width:34px"><input type="checkbox" id="smt" style="width:auto" title="Marcar todos"></th>':"")+cols.map(function(f){return'<th>'+f.l+'</th>'}).join("")+(ro?"":(n==="clientes"?"<th>Contrato</th><th>Resumo</th>":"")+"<th></th>")+'</tr></thead><tbody>';
  list.forEach(function(r){
    h+='<tr>'+(n==="produtos"?'<td><input type="checkbox" class="sm" value="'+r.id+'" style="width:auto"'+(marc[r.id]?" checked":"")+'></td>':"")+cols.map(function(f){
      var v=r[f.k];
      if(f.k==="preco"||f.k==="valor")v=brl(v);
      else if(f.k==="data")v=fdata(v);
      else if(f.k==="conta")v=contaNome(v);
      else if(f.k==="tipo"&&n==="lancamentos")return'<td><span class="tag '+(v==="Crédito"?"db":"cr")+'">'+esc(v)+'</span></td>';
      else if(f.k==="estoque")return'<td class="'+(Number(v)<=5?"low":"")+'">'+esc(v==null?"":v)+'</td>';
      else if(f.k==="categoria"&&v)return'<td><span class="tag">'+esc(v)+'</span></td>';
      else if(f.k==="cidade")v=(r.cidade||"")+(r.uf?" / "+r.uf:"");
      return'<td>'+esc(v)+'</td>'}).join("")+
    (ro?"":(n==="clientes"?contratoCell(r)+'<td><button class="btn e" data-rs="'+r.id+'">PDF</button></td>':"")+'<td style="white-space:nowrap;text-align:right"><button class="btn e" data-e="'+r.id+'">Editar</button><button class="btn d" data-d="'+r.id+'">Excluir</button></td>')+'</tr>';
  });
  h+='</tbody></table></div>';
  setTimeout(function(){
    document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){abrir(b.dataset.e)}});
    document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){del(view,b.dataset.d)}});
    document.querySelectorAll("[data-ct]").forEach(function(b){b.onclick=function(){anexarContrato(b.dataset.ct)}});
    document.querySelectorAll("[data-cr]").forEach(function(b){b.onclick=function(){removerContrato(b.dataset.cr)}});
    document.querySelectorAll(".sm").forEach(function(x){x.onchange=function(){if(x.checked)marc[x.value]=1;else delete marc[x.value];updMarc()}});
    var st=document.getElementById("smt");if(st){st.onchange=function(){document.querySelectorAll(".sm").forEach(function(x){x.checked=st.checked;if(x.checked)marc[x.value]=1;else delete marc[x.value]});updMarc()};updMarc()}
    document.querySelectorAll("[data-cv]").forEach(function(b){b.onclick=function(){verContrato(b.dataset.cv)}});
    document.querySelectorAll("[data-cb]").forEach(function(b){b.onclick=function(){baixarContrato(b.dataset.cb)}});
    document.querySelectorAll("[data-rs]").forEach(function(b){b.onclick=function(){pdfResumoCliente(b.dataset.rs)}});
  },0);
  return h;
}
function abrir(id,pre){
  var S=SCHEMA[view];editId=id;
  var r=id?data[view].find(function(x){return x.id===id}):Object.assign({data:view==="lancamentos"?new Date().toISOString().slice(0,10):undefined},pre||{});
  $("#dt").textContent=(id?"Editar ":(S.g?"Nova ":"Novo "))+S.titulo.toLowerCase();
  $("#fields").innerHTML=S.campos.map(function(f){
    return'<label class="'+(f.w?"w":"")+'">'+f.l+(f.req?" *":"")+(f.opts?selectHtml(f,r[f.k]):'<input name="'+f.k+'" type="'+(f.t||"text")+'"'+(f.step?' step="'+f.step+'"':"")+' value="'+esc(r[f.k])+'">')+'</label>'}).join("");
  $("#dlg").showModal();
}
$("#cancel").onclick=function(){$("#dlg").close()};
$("#save").onclick=function(){
  var S=SCHEMA[view],obj=Object.assign({},editId?data[view].find(function(x){return x.id===editId}):{},{id:editId||newId()});
  for(var i=0;i<S.campos.length;i++){
    var f=S.campos[i],v=document.querySelector('#fields [name="'+f.k+'"]').value.trim();
    if(f.req&&!v){alert("Preencha: "+f.l);return}
    obj[f.k]=f.t==="number"&&v!==""?Number(v):v;
  }
  put(view,obj);$("#dlg").close();
};
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){view=b.dataset.v;q="";render()}});

/* ---- autenticação e inicialização Supabase ---- */
var hd=document.getElementById("hdata");if(hd)hd.textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
Object.keys(SCHEMA).forEach(function(n){data[n]=[]});
function gateMessage(msg,error){var el=document.getElementById("gate-msg");el.textContent=msg||"";el.style.color=error?"var(--bad)":"var(--mut)"}
function showGateLoading(msg){document.body.classList.remove("authed");document.getElementById("gate").style.display="flex";gateMessage(msg||"Carregando dados protegidos…",false)}
async function activateSession(session){
  if(!session||!session.user){deactivateSession();return}
  if(activeUserId===session.user.id&&document.body.classList.contains("authed"))return;
  if(loadingSession)return;
  loadingSession=true;activeUserId=session.user.id;showGateLoading("Conectando ao banco seguro…");
  document.getElementById("user-email").textContent=session.user.email||"Usuário autenticado";
  try{
    var r=await sbClient.from("app_records").select("collection,id,data");
    if(r.error)throw r.error;
    Object.keys(SCHEMA).forEach(function(n){data[n]=[]});
    (r.data||[]).forEach(function(row){if(data[row.collection]&&row.data){var o=row.data;o.id=String(row.id);data[row.collection].push(o)}});
    mode="db";document.body.classList.add("authed");document.getElementById("gate").style.display="none";gateMessage("");render();
    if(sbChannel)await sbClient.removeChannel(sbChannel);
    sbChannel=sbClient.channel("shared-app-records")
      .on("postgres_changes",{event:"*",schema:"public",table:"app_records"},function(payload){
        var row=payload.new&&payload.new.id?payload.new:payload.old;if(!row||!data[row.collection])return;
        if(payload.eventType==="DELETE")data[row.collection]=data[row.collection].filter(function(x){return String(x.id)!==String(row.id)});
        else if(row.data){var o=row.data;o.id=String(row.id);var i=data[row.collection].findIndex(function(x){return String(x.id)===String(row.id)});if(i<0)data[row.collection].push(o);else data[row.collection][i]=o}
        render();
      }).subscribe();
  }catch(e){activeUserId=null;deactivateSession();document.getElementById("gate").style.display="flex";gateMessage("Não foi possível carregar os dados. Confirme se o SQL de configuração foi executado no Supabase. "+(e&&e.message||e),true)}
  finally{loadingSession=false}
}
function deactivateSession(){
  if(sbChannel){sbClient.removeChannel(sbChannel);sbChannel=null}
  activeUserId=null;mode="auth";document.body.classList.remove("authed");document.getElementById("gate").style.display="flex";
  document.getElementById("user-email").textContent="";Object.keys(SCHEMA).forEach(function(n){data[n]=[]});
}
document.getElementById("login-form").addEventListener("submit",async function(e){
  e.preventDefault();var button=document.getElementById("login-button");button.disabled=true;gateMessage("Validando acesso…",false);
  var r=await sbClient.auth.signInWithPassword({email:document.getElementById("login-email").value.trim(),password:document.getElementById("login-password").value});
  button.disabled=false;if(r.error)gateMessage(r.error.message==="Invalid login credentials"?"E-mail ou senha inválidos.":r.error.message,true);
});
document.getElementById("reset-button").onclick=async function(){
  var email=document.getElementById("login-email").value.trim();if(!email){gateMessage("Informe seu e-mail para receber o link de redefinição.",true);return}
  var r=await sbClient.auth.resetPasswordForEmail(email,{redirectTo:location.href});
  gateMessage(r.error?r.error.message:"Se o e-mail estiver cadastrado, você receberá instruções para redefinir a senha.",!!r.error);
};
document.getElementById("logout").onclick=async function(){await sbClient.auth.signOut()};
sbClient.auth.onAuthStateChange(function(event,session){setTimeout(function(){if(session)activateSession(session);else deactivateSession()},0)});
sbClient.auth.getSession().then(function(r){if(r.error){showGateLoading("Não foi possível validar a sessão.");gateMessage(r.error.message,true);return}if(r.data.session)activateSession(r.data.session);else deactivateSession()});
</script>
